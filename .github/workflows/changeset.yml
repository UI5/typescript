name: Changeset

# Verifies that every PR carries a changeset (or an explicit empty one).
# Runs only on pull_request — `push` to main carries already-merged
# changesets that the Release workflow then consumes.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to test (for fork PRs)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  changeset:
    name: Changeset present
    runs-on: ubuntu-latest
    # Skip on the auto-generated "Version Packages" PR and on Renovate dependency updates
    # (dependency bumps don't need changelog entries).
    if: >-
      github.head_ref != 'changeset-release/main' &&
      !(startsWith(github.head_ref, 'renovate/') && startsWith(github.event.pull_request.user.login || '', 'renovate'))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.pr_number && format('refs/pull/{0}/head', inputs.pr_number) || '' }}
          # Full history so `changeset status --since=origin/main` can diff.
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails the PR if no changeset describes the change.
      # Add one with `pnpm changeset` (or `pnpm changeset:empty` for PRs
      # that don't need a release entry) and commit it.
      # We check `.changesets` (not `.releases`) so that empty changesets
      # — which have 0 package bumps but still document the PR — pass.
      - name: Verify changeset is present
        run: |
          pnpm changeset status --since=origin/main --output=/tmp/cs.json
          if [ "$(jq '.changesets | length' /tmp/cs.json)" -eq 0 ]; then
            echo "::error::No changeset found on this PR. Run 'pnpm changeset' (or 'pnpm changeset:empty' for PRs that don't need a release entry) and commit the file."
            exit 1
          fi
